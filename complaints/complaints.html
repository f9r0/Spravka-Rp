<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spravka</title>
    <link rel="stylesheet" href="/templates.css">
    <link rel="stylesheet" href="/complaints/complaints.css">
    <script src="https://unpkg.com/@lottiefiles/lottie-player@latest/dist/lottie-player.js"></script>

    <script src="/api.js"></script>
</head>
<body>
    <div class="hot-bar-container">
        <a href="/index.html">Главная</a>
        <a href="/complaints/complaints.html">Жалобы</a>
        <a href="/explanations/explanations.html">Как Играть</a>
    </div>

    <lottie-player 
        src="/animations/document.json" 
        background="transparent" 
        speed="1" 
        style="width: 300px; height: 300px; margin-top: 100px;"
        autoplay
        class="smooth">
    </lottie-player>

    <template id="complaint-template">
        <div class="complaint-container">
            <h1 style="margin: 0; color: #fdce00;" class="complaint-name">Имя</h1>
            <span style="font-size: large;" class="complaint-text">Пусто</span>

            <h1 style="margin-top: 20px; color: #fdce00;">Доказательства:</h1>
            <a class="complaint-proof" target="_blank">Пусто</a>

            <h4 style="margin-top: 20px;" class="complaint-created-at">created_at</h4>
        </div>
    </template>

    <button class="smooth" onclick="window.location.href = '/make-complaint/make-complaint.html'" style="font-size: larger; margin: 40px;">Написать Жалобу</button>

    <div id="complaintList" class="global-container"></div>

    <script src="/complaints/complaints.js"></script>
    <script src="/scroll.js" target="_blank"></script>
</body>
</html>
